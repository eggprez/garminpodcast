<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GarminPodcast{% endblock %}</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b2f38;
    --text: #e6e8ec; --muted: #969ba7; --accent: #4cbb17; --danger: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header nav { margin-left: auto; display: flex; gap: 16px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .8px;
       color: var(--muted); margin: 32px 0 12px; }
  h2:first-of-type { margin-top: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  form.inline { display: inline; }
  button {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 6px;
    border: 1px solid var(--line); background: #262a33; color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  input[type=text], input[type=password], input[type=url], input[type=number] {
    font: inherit; padding: 8px 11px; border-radius: 6px; color: var(--text);
    border: 1px solid var(--line); background: #101216; min-width: 260px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 20px;
           border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--accent); border-color: var(--accent); }
  .badge.err { color: var(--danger); border-color: var(--danger); }
  code { background: #101216; padding: 2px 6px; border-radius: 4px;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  pre code { display: block; padding: 14px; overflow-x: auto; }
  .warn { border-left: 3px solid var(--danger); padding: 10px 14px;
          background: rgba(229,83,75,.08); border-radius: 0 8px 8px 0; margin-bottom: 18px; }

  /* --- show library --- */
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color .12s ease, transform .12s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card a.cover { display: block; aspect-ratio: 1 / 1; background: #101216; }
  .card a.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .placeholder, .showhead .placeholder {
    width: 100%; height: 100%; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 30px;
    background: linear-gradient(140deg, #262a33, #1a1d24);
  }
  .card .body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 3px; }
  .card .name {
    font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .by { font-size: 12px; color: var(--muted);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .stats { font-size: 12px; color: var(--muted); margin-top: 5px;
                 display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--accent); }
  .dot.err { background: var(--danger); }
  .dot.work { background: #d5a02f; }

  /* --- show detail header --- */
  .showhead { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 26px; }
  .showhead img, .showhead .placeholder {
    width: 132px; height: 132px; border-radius: 10px; object-fit: cover;
    border: 1px solid var(--line); background: #101216; flex-shrink: 0;
  }
  .showhead h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.25; }
  .showhead .by { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  .back { font-size: 13px; color: var(--muted); display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--accent); }
  @media (max-width: 560px) {
    .showhead { flex-direction: column; gap: 14px; }
  }
</style>
</head>
<body>
{% block header %}
<header>
  <h1>GarminPodcast</h1>
  <nav>
    <a href="/">Library</a>
    <a href="/settings">Settings</a>
    <a href="/token">Watch setup</a>
    <a href="/logout">Log out</a>
  </nav>
</header>
{% endblock %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
