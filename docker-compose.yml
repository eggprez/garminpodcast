# Runs as-is with no .env file and no edits.
#
# Every setting below is optional and falls back to the image default. The only
# one you should change before putting this on the internet is
# PODCAST_ADMIN_PASSWORD.
services:
  garminpodcast:
    image: ghcr.io/eggprez/garminpodcast:latest
    # To build from source instead of pulling, comment out `image:` above and
    # uncomment the line below.
    # build: .
    #
    # Without this, Docker keeps using the copy of :latest it already cached and
    # never notices a new one. With it, every restart re-checks the registry.
    # The cost is that a restart needs the registry reachable.
    pull_policy: always
    container_name: garminpodcast
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # --- web UI login ---
      PODCAST_ADMIN_USER: "${PODCAST_ADMIN_USER:-admin}"
      PODCAST_ADMIN_PASSWORD: "${PODCAST_ADMIN_PASSWORD:-changeme}"

      # --- public address, shown on the watch-setup page ---
      PODCAST_BASE_URL: "${PODCAST_BASE_URL:-}"
      # Set true once you reach this only over HTTPS.
      PODCAST_COOKIE_SECURE: "${PODCAST_COOKIE_SECURE:-false}"

      # --- library behaviour ---
      PODCAST_RETENTION_DAYS: "${PODCAST_RETENTION_DAYS:-14}"
      PODCAST_EPISODES_PER_FEED: "${PODCAST_EPISODES_PER_FEED:-5}"
      PODCAST_REFRESH_MINUTES: "${PODCAST_REFRESH_MINUTES:-60}"

      # --- audio normalisation ---
      PODCAST_TRANSCODE_MODE: "${PODCAST_TRANSCODE_MODE:-auto}"
      PODCAST_MAX_BITRATE_KBPS: "${PODCAST_MAX_BITRATE_KBPS:-128}"
      PODCAST_TARGET_BITRATE_KBPS: "${PODCAST_TARGET_BITRATE_KBPS:-64}"
