services:
  garminpodcast:
    build: .
    # Or pull the published image instead of building locally:
    # image: ghcr.io/eggprez/garminpodcast:latest
    container_name: garminpodcast
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # --- required ---
      PODCAST_ADMIN_USER: "${PODCAST_ADMIN_USER:-admin}"
      PODCAST_ADMIN_PASSWORD: "${PODCAST_ADMIN_PASSWORD:?set this in .env}"
      # Keeps you logged in across restarts; generate with `openssl rand -hex 32`.
      PODCAST_SECRET_KEY: "${PODCAST_SECRET_KEY:?set this in .env}"

      # --- public address, shown on the watch-setup page ---
      PODCAST_BASE_URL: "${PODCAST_BASE_URL:-}"
      # Set true once you are reaching this only over HTTPS.
      PODCAST_COOKIE_SECURE: "${PODCAST_COOKIE_SECURE:-false}"

      # --- library behaviour ---
      PODCAST_RETENTION_DAYS: "${PODCAST_RETENTION_DAYS:-14}"
      PODCAST_EPISODES_PER_FEED: "${PODCAST_EPISODES_PER_FEED:-5}"
      PODCAST_REFRESH_MINUTES: "${PODCAST_REFRESH_MINUTES:-60}"

      # --- audio normalisation ---
      PODCAST_TRANSCODE_MODE: "${PODCAST_TRANSCODE_MODE:-auto}"
      PODCAST_MAX_BITRATE_KBPS: "${PODCAST_MAX_BITRATE_KBPS:-128}"
      PODCAST_TARGET_BITRATE_KBPS: "${PODCAST_TARGET_BITRATE_KBPS:-64}"
